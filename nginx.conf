# Rendered to /etc/nginx/conf.d/default.conf at container start by the nginx
# image entrypoint (envsubst substitutes ${ACBF_TRUSTED_PROXY_CIDR} only; nginx
# variables such as $remote_addr are untouched).
#
# ACBF_TRUSTED_PROXY_CIDR must be the private network the platform proxy
# (Dokploy/Traefik) uses to reach this container — never 0.0.0.0/0.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The API enforces its own 16 KiB JSON limit; this is only an outer guard so
    # an oversized request cannot be buffered by the frontend.
    client_max_body_size 32k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Resolve the browser address behind the platform proxy. A public client
    # cannot reach this container directly, and X-Forwarded-For is only honoured
    # from the configured private proxy network.
    set_real_ip_from ${ACBF_TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Resolve the api service on every request so a recreated backend container
    # is picked up without pinning a stale address (Docker embedded DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:3001";

    location ^~ /api/ {
        # Preserve the path and never fall back to index.html: an API caller must
        # never receive SPA HTML, and a failed backend must return JSON.
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # The API reads only this header, and nginx overwrites it, so a browser
        # cannot choose its own rate-limit identity.
        proxy_set_header X-ACBF-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_intercept_errors on;
        error_page 413 = @api_body_too_large;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":{"code":"unavailable","message":"The voting service is temporarily unavailable. Please try again."}}';
    }

    location @api_body_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"error":{"code":"invalid-argument","message":"The request body is too large."}}';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
