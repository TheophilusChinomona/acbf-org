services:
  # Static frontend (public domain). Proxies /api/v1/ to the internal api service.
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY is required}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?VITE_FIREBASE_AUTH_DOMAIN is required}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID is required}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?VITE_FIREBASE_STORAGE_BUCKET is required}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?VITE_FIREBASE_MESSAGING_SENDER_ID is required}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?VITE_FIREBASE_APP_ID is required}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      # Private network the platform proxy uses to reach nginx. Required: a wrong
      # value would let a caller spoof the client IP used for vote rate limits.
      ACBF_TRUSTED_PROXY_CIDR: ${ACBF_TRUSTED_PROXY_CIDR:?ACBF_TRUSTED_PROXY_CIDR is required (private proxy network, never 0.0.0.0/0)}
    depends_on:
      # Startup ordering only. If the API cannot start, the site must stay up with
      # a JSON 503 on /api/*; gating on service_healthy would turn a broken
      # credential into a whole-site outage.
      api:
        condition: service_started
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Internal voting/invitation API. No published ports: only nginx reaches it.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: "3001"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      # Exact browser origin allowed on mutation routes, e.g. https://acbf.org.za
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    volumes:
      # Host path must exist on the deployment server; this variable never creates
      # the file. The file must be readable by uid 1000 inside the container.
      - ${FIREBASE_ADMIN_CREDENTIALS_FILE:?FIREBASE_ADMIN_CREDENTIALS_FILE must point to the host service-account file}:/run/secrets/firebase-admin.json:ro
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
